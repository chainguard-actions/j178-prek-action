name: Test running prek hooks
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a minimal test workspace with pre-commit config
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/prek-workspace"
          cd "$GITHUB_WORKSPACE/tests/fixtures/prek-workspace"

          # Initialize a git repo in the workspace
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Create a minimal pre-commit config using only builtin hooks
          cat > .pre-commit-config.yaml << 'EOF'
          repos:
            - repo: builtin
              hooks:
                - id: trailing-whitespace
                - id: end-of-file-fixer
          EOF

          # Create a clean test file
          echo "hello world" > test.txt

          # Commit everything so prek can run on it
          git add .
          git commit -m "Initial commit"

      - id: action
        name: Run prek hooks on test workspace
        uses: .
        with:
          install-only: "false"
          extra-args: "--all-files"
          working-directory: "tests/fixtures/prek-workspace"
          show-verbose-logs: "true"

      - name: Assert prek-version output is set
        env:
          PREK_VERSION: ${{ steps.action.outputs.prek-version }}
        run: |
          echo "prek-version: $PREK_VERSION"
          if [ -z "$PREK_VERSION" ]; then
            echo "FAIL: prek-version output is empty"
            exit 1
          fi
          echo "PASS: prek ran successfully, version is '$PREK_VERSION'"
