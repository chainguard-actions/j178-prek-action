name: Test working-directory and show-verbose-logs inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up a subdirectory with a pre-commit config
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/prek-workdir"
          cd "$GITHUB_WORKSPACE/tests/fixtures/prek-workdir"
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          cat > .pre-commit-config.yaml <<'EOF'
          repos:
            - repo: builtin
              hooks:
                - id: trailing-whitespace
                - id: end-of-file-fixer
          EOF
          printf 'clean file\n' > clean.txt
          git add .
          git commit -m "initial commit"
      - id: action
        uses: .
        with:
          install-only: "false"
          cache: "false"
          working-directory: "tests/fixtures/prek-workdir"
          show-verbose-logs: "false"
          extra-args: "--all-files"
      - name: Assert prek-version output is set
        env:
          PREK_VERSION: ${{ steps.action.outputs.prek-version }}
        run: |
          echo "prek-version: $PREK_VERSION"
          if [ -z "$PREK_VERSION" ]; then
            echo "FAIL: prek-version output is empty"
            exit 1
          fi
          if [[ "$PREK_VERSION" != v* ]]; then
            echo "FAIL: prek-version does not start with 'v': $PREK_VERSION"
            exit 1
          fi
          echo "PASS: prek ran in working-directory, version=$PREK_VERSION"
