name: Test basic prek run
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal pre-commit config and clean test files
        run: |
          mkdir -p /tmp/prek-test-workspace
          cd /tmp/prek-test-workspace
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"

          # Write a minimal pre-commit config with only builtin hooks
          cat > .pre-commit-config.yaml << 'EOF'
          repos:
            - repo: builtin
              hooks:
                - id: trailing-whitespace
                - id: end-of-file-fixer
          EOF

          # Write a clean file that will pass all hooks
          echo "hello world" > hello.txt

          # Commit everything so prek can run against it
          git add .
          git commit -m "initial commit"

      - id: action
        uses: .
        with:
          install-only: "true"

      - name: Run prek manually in the test workspace
        run: |
          cd /tmp/prek-test-workspace
          prek run --show-diff-on-failure --color=always --all-files
          echo "PASS: prek run succeeded"

      - name: Assert prek-version output is set
        env:
          PREK_VERSION: ${{ steps.action.outputs.prek-version }}
        run: |
          echo "prek-version: $PREK_VERSION"
          if [ -z "$PREK_VERSION" ]; then
            echo "FAIL: prek-version output is empty"
            exit 1
          fi
          echo "PASS: prek-version is '$PREK_VERSION'"
