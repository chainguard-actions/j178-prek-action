name: Test cache output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          install-only: "true"
          cache: "true"

      - name: Assert cache-hit output is set to a boolean value
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
          PREK_VERSION: ${{ steps.action.outputs.prek-version }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          echo "prek-version: $PREK_VERSION"

          # cache-hit should be either "true" or "false"
          if [ "$CACHE_HIT" = "true" ] || [ "$CACHE_HIT" = "false" ]; then
            echo "PASS: cache-hit is '$CACHE_HIT'"
          else
            echo "FAIL: cache-hit should be 'true' or 'false', got '$CACHE_HIT'"
            exit 1
          fi

          if [ -z "$PREK_VERSION" ]; then
            echo "FAIL: prek-version output is empty"
            exit 1
          fi
          echo "PASS: prek-version is '$PREK_VERSION'"
