name: Test install-only mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          install-only: "true"
          prek-version: "latest"

      - name: Assert prek-version output is set
        env:
          PREK_VERSION: ${{ steps.action.outputs.prek-version }}
        run: |
          echo "prek-version: $PREK_VERSION"
          if [ -z "$PREK_VERSION" ]; then
            echo "FAIL: prek-version output is empty"
            exit 1
          fi
          echo "PASS: prek-version is '$PREK_VERSION'"

      - name: Assert prek binary is available
        run: |
          if ! command -v prek >/dev/null 2>&1; then
            echo "FAIL: prek binary not found on PATH"
            exit 1
          fi
          echo "PASS: prek is available at $(command -v prek)"
          prek --version
