name: Test specific prek version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          install-only: "true"
          prek-version: "0.3.x"

      - name: Assert prek-version output is set
        env:
          PREK_VERSION: ${{ steps.action.outputs.prek-version }}
        run: |
          echo "prek-version: $PREK_VERSION"
          if [ -z "$PREK_VERSION" ]; then
            echo "FAIL: prek-version output is empty"
            exit 1
          fi
          echo "PASS: prek-version is '$PREK_VERSION'"

      - name: Assert prek binary is available and version matches semver range
        env:
          PREK_VERSION: ${{ steps.action.outputs.prek-version }}
        run: |
          if ! command -v prek >/dev/null 2>&1; then
            echo "FAIL: prek binary not found on PATH"
            exit 1
          fi
          echo "PASS: prek is available"
          # The version should start with v0.3.
          if echo "$PREK_VERSION" | grep -qE '^v?0\.3\.'; then
            echo "PASS: version '$PREK_VERSION' matches 0.3.x range"
          else
            echo "FAIL: version '$PREK_VERSION' does not match 0.3.x range"
            exit 1
          fi
