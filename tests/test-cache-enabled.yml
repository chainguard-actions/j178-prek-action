name: Test prek with cache enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          install-only: "true"
          cache: "true"
      - name: Assert prek-version output is set
        env:
          PREK_VERSION: ${{ steps.action.outputs.prek-version }}
        run: |
          echo "prek-version: $PREK_VERSION"
          if [ -z "$PREK_VERSION" ]; then
            echo "FAIL: prek-version output is empty"
            exit 1
          fi
          echo "PASS: prek-version is '$PREK_VERSION'"
      - name: Assert cache-hit output is a boolean string
        env:
          CACHE_HIT: ${{ steps.action.outputs.cache-hit }}
        run: |
          echo "cache-hit: $CACHE_HIT"
          if [ "$CACHE_HIT" != "true" ] && [ "$CACHE_HIT" != "false" ]; then
            echo "FAIL: cache-hit should be 'true' or 'false', got '$CACHE_HIT'"
            exit 1
          fi
          echo "PASS: cache-hit is '$CACHE_HIT'"
      - name: Assert prek binary is installed
        run: |
          if ! command -v prek >/dev/null 2>&1; then
            echo "FAIL: prek binary not found on PATH"
            exit 1
          fi
          echo "PASS: prek is installed at $(command -v prek)"
